<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"> 
<title>Wander Film Connection Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #faf8f4; color: #1c1c2e; min-height: 100vh; padding: 2rem 1rem; }
  .app { max-width: 680px; margin: 0 auto; }
.app-header { background: #1c1c2e; border-radius: 16px; padding: 1.5rem 1.75rem; display: flex; align-items: center; gap: 16px; margin-bottom: 1.75rem; }
.app-header-reel { font-size: 36px; flex-shrink: 0; }
.app-header h1 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #f5e6c8; line-height: 1.2; margin-bottom: 4px; }
.app-header .subtitle { font-size: 11px; color: #8888aa; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0; }  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
.tab-row { display: flex; border-bottom: 1.5px solid #e8e2d9; margin-bottom: 1.25rem; }
.tab { font-size: 13px; padding: 8px 16px; cursor: pointer; border: none; background: transparent; color: #9090a0; border-bottom: 2px solid transparent; margin-bottom: -1.5px; font-family: 'Inter', sans-serif; }
.tab.active { color: #1c1c2e; border-bottom-color: #c9a84c; font-weight: 600; } 
.search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.search-row input { flex: 1; padding: 9px 14px; font-size: 14px; border: 1.5px solid #e0dbd2; border-radius: 10px; outline: none; background: white; font-family: 'Inter', sans-serif; color: #1c1c2e; }
.search-row input:focus { border-color: #c9a84c; }
.search-row button { padding: 9px 20px; font-size: 13px; font-weight: 600; border: none; border-radius: 10px; background: #1c1c2e; color: #f5e6c8; cursor: pointer; font-family: 'Inter', sans-serif; }
.search-row button:hover { background: #2e2e48; }
  .section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.5rem 0 0.5rem; }
.film-card { background: white; border: 1.5px solid #e8e2d9; border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; box-shadow: 0 1px 3px rgba(28,28,46,0.04); transition: box-shadow 0.15s, border-color 0.15s; }
.film-card:hover { box-shadow: 0 4px 14px rgba(28,28,46,0.10); border-color: #d0c9be; }

.poster-placeholder { width: 52px; height: 78px; border-radius: 6px; background: #e8e2d9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.film-info { flex: 1; min-width: 0; }
.film-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 15px; margin-bottom: 3px; color: #1c1c2e; }
.film-title a { color: #1c1c2e; text-decoration: none; }
.film-title a:hover { color: #c9a84c; }
.film-meta { font-size: 12px; color: #9090a0; margin-bottom: 6px; }
.rating-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; }
.star { color: #c9a84c; }
  .connection-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; color: #1a56db; margin-right: 4px; margin-bottom: 4px; }
.btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn-sm { font-size: 12px; padding: 4px 10px; cursor: pointer; border: 1.5px solid #e0dbd2; border-radius: 6px; background: transparent; color: #555; font-family: 'Inter', sans-serif; }
.btn-sm:hover { background: #faf8f4; }
.btn-watched { border-color: #2d7a4f; color: #2d7a4f; }
.btn-watched:hover { background: #f0faf4; }
.btn-select { border-color: #1c1c2e; color: #1c1c2e; }
.btn-select:hover { background: #f5f4f0; }
.status-msg { font-size: 14px; color: #9090a0; padding: 1rem 0; }
.current-banner { background: white; border: 1.5px solid #e8e2d9; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(28,28,46,0.04); }
.watched-pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #dcfce7; color: #2d7a4f; margin-left: 6px; }

.connection-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 5px; background: #eef2ff; color: #3a4fd4; border: 1px solid #c7d0f8; margin-right: 4px; margin-bottom: 4px; }
.overview { font-size: 12px; color: #555566; line-height: 1.6; margin: 6px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .empty-state { text-align: center; padding: 2rem 0; color: #888; font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
  .filter-panel { background: white; border: 1px solid #e8e8e8; border-radius: 12px; padding: 0.875rem 1.25rem; margin-bottom: 1rem; }
  .filter-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.625rem; }
  .filter-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
  .filter-actions { display: flex; gap: 8px; }
  .filter-link { font-size: 12px; color: #1a56db; background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; }
  .filter-link:hover { color: #1240a0; }
  .filter-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #333; background: #f8f7ff; border: 1px solid #e0dbff; border-radius: 6px; padding: 3px 10px 3px 7px; cursor: pointer; user-select: none; }
  .filter-checkbox-label:hover { background: #f0ecff; }
  .filter-checkbox-label input { accent-color: #6d28d9; cursor: pointer; }
  .filter-checkbox-label.inactive { background: #f5f5f5; border-color: #e0e0e0; color: #aaa; }
  .no-results-msg { font-size: 14px; color: #888; padding: 1rem 0; }
  .refresh-bar { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 10px; padding: 0.75rem 1rem; margin-top: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #92400e; }
  .refresh-bar button { font-size: 12px; padding: 4px 12px; border: 1px solid #f59e0b; border-radius: 6px; background: white; color: #92400e; cursor: pointer; white-space: nowrap; }
  .refresh-bar button:hover { background: #fef3c7; }
.mode-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.mode-label { font-size: 12px; color: #9090a0; }
.btn-mode { font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer; border: 1.5px solid #e0dbd2; background: white; color: #666; font-family: 'Inter', sans-serif; }
.btn-mode:hover { background: #faf8f4; }
.btn-mode.active { background: #1c1c2e; color: #f5e6c8; border-color: #1c1c2e; font-weight: 600; }
.btn-mode-advanced { border-color: #c9a84c; color: #a07c20; }
.btn-mode-advanced:hover { background: #fdf3d8; }
.btn-mode-advanced.active { background: #c9a84c; color: #1c1c2e; border-color: #c9a84c; font-weight: 600; }
.results-mode-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
.results-mode-tag.quick { background: #eef2ff; color: #3a4fd4; }
.results-mode-tag.advanced { background: #fdf3d8; color: #a07c20; }
.exclude-section { margin-bottom: 1rem; }
.exclude-toggle { font-size: 12px; color: #a07c20; background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; display: block; margin-bottom: 6px; font-family: 'Inter', sans-serif; }
.exclude-toggle:hover { color: #7a5c10; }
.exclude-search-row { display: flex; gap: 6px; margin-bottom: 6px; }
.exclude-search-row input { flex: 1; padding: 6px 10px; font-size: 13px; border: 1.5px solid #e0dbd2; border-radius: 8px; outline: none; font-family: 'Inter', sans-serif; }
.exclude-search-row input:focus { border-color: #c9a84c; }
.exclude-search-row button { padding: 6px 12px; font-size: 12px; border: 1.5px solid #e0dbd2; border-radius: 8px; background: white; color: #666; cursor: pointer; font-family: 'Inter', sans-serif; }
.exclude-search-row button:hover { background: #faf8f4; }
.exclude-dropdown { background: white; border: 1.5px solid #e8e2d9; border-radius: 10px; overflow: hidden; margin-bottom: 6px; box-shadow: 0 2px 8px rgba(28,28,46,0.08); }
.exclude-person { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f0ece6; }
.exclude-person:last-child { border-bottom: none; }
.exclude-person:hover { background: #fdf3d8; }
.exclude-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #e8e2d9; flex-shrink: 0; }
.exclude-avatar-placeholder { width: 36px; height: 36px; border-radius: 50%; background: #e8e2d9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.exclude-person-name { font-size: 13px; font-weight: 500; color: #1c1c2e; }
.exclude-person-known { font-size: 12px; color: #9090a0; }
.exclude-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.exclude-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #fdf3d8; color: #a07c20; border: 1px solid #f0dfa0; }
.exclude-pill button { background: none; border: none; cursor: pointer; color: #a07c20; font-size: 13px; padding: 0; line-height: 1; }
.filter-panel { background: white; border: 1.5px solid #e8e2d9; border-radius: 12px; padding: 0.875rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(28,28,46,0.04); }
.filter-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.625rem; }
.filter-title { font-size: 11px; font-weight: 600; color: #9090a0; text-transform: uppercase; letter-spacing: 0.06em; }
.filter-actions { display: flex; gap: 8px; }
.filter-link { font-size: 12px; color: #a07c20; background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; font-family: 'Inter', sans-serif; }
.filter-link:hover { color: #7a5c10; }
.filter-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #444; background: #fdf3d8; border: 1px solid #f0dfa0; border-radius: 6px; padding: 3px 10px 3px 7px; cursor: pointer; user-select: none; }
.filter-checkbox-label:hover { background: #faecc0; }
.filter-checkbox-label input { accent-color: #c9a84c; cursor: pointer; }
.filter-checkbox-label.inactive { background: #f5f5f5; border-color: #e0e0e0; color: #aaa; }

.refresh-bar { background: #fffbeb; border: 1px solid #f0dfa0; border-radius: 10px; padding: 0.75rem 1rem; margin-top: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #a07c20; }
.refresh-bar button { font-size: 12px; padding: 4px 12px; border: 1px solid #c9a84c; border-radius: 6px; background: white; color: #a07c20; cursor: pointer; white-space: nowrap; font-family: 'Inter', sans-serif; }
.refresh-bar button:hover { background: #fdf3d8; }

<body>
<div class="app">
  <div class="app-header">
    <div class="app-header-reel">🎬</div>
    <div>
      <h1>Wander Film Connection Generator</h1>
      <p class="subtitle">Pick your next film based on cast &amp; crew links</p>
    </div>
  </div>

  <div class="tab-row">
    <button class="tab active" onclick="showTab('search')" id="tab-search">Find connections</button>
    <button class="tab" onclick="showTab('watched')" id="tab-watched">Watched list</button>
  </div>

  <div id="view-search">
    <div id="current-banner" style="display:none"></div>
    <div id="mode-bar" style="display:none" class="mode-bar">
      <span class="mode-label">Search mode:</span>
      <button class="btn-mode active" id="btn-quick" onclick="setMode('quick')">⚡ Quick search</button>
      <button class="btn-mode btn-mode-advanced" id="btn-advanced" onclick="setMode('advanced')">🔍 Advanced search</button>
    </div>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search for a film..." oninput="onInput()" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()">Search</button>
    </div>
    <div id="search-results"></div>
    <div id="genre-filter" style="display:none"></div>
    <div id="exclude-section" style="display:none" class="exclude-section"></div>
    <div id="recommendations"></div>
  </div>

  <div id="view-watched" style="display:none">
    <div id="watched-list"></div>
  </div>
</div>

<script>
const API_KEY = '138351686e8ff360cf32f00c4799001c';
const BASE = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/w92';

function getWatched() { try { return JSON.parse(localStorage.getItem('fc_watched') || '{}'); } catch(e) { return {}; } }
function saveWatched(w) { localStorage.setItem('fc_watched', JSON.stringify(w)); }
function getCurrentFilm() { try { return JSON.parse(localStorage.getItem('fc_current') || 'null'); } catch(e) { return null; } }
function saveCurrentFilm(f) { localStorage.setItem('fc_current', JSON.stringify(f)); }

let searchTimeout;
function onInput() { clearTimeout(searchTimeout); searchTimeout = setTimeout(doSearch, 400); }

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  document.getElementById('search-results').innerHTML = '<p class="status-msg">Searching...</p>';
  document.getElementById('recommendations').innerHTML = '';
  try {
    const r = await fetch(`${BASE}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=en-US`);
    const d = await r.json();
    renderSearchResults(d.results || []);
  } catch(e) {
    document.getElementById('search-results').innerHTML = '<p class="status-msg">Search failed. Check your internet connection.</p>';
  }
}

function renderSearchResults(films) {
  const watched = getWatched();
  if (!films.length) { document.getElementById('search-results').innerHTML = '<p class="status-msg">No films found.</p>'; return; }
  document.getElementById('search-results').innerHTML = '<p class="section-label">Select the film you just watched</p>' +
    films.slice(0,6).map(f => filmCard(f, watched, 'search')).join('');
}

function esc(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function filmCard(f, watched, mode) {
  const isWatched = !!watched[f.id];
  const year = f.release_date ? f.release_date.slice(0,4) : '';
  const rating = f.vote_average ? `<span class="rating-badge"><span class="star">★</span> ${f.vote_average.toFixed(1)}</span>` : '';
  const watchedTag = isWatched ? `<span class="watched-pill">✓ watched</span>` : '';
  const poster = f.poster_path
    ? `<img class="poster" src="${IMG}${f.poster_path}" alt="${f.title} poster" loading="lazy">`
    : `<div class="poster-placeholder">🎬</div>`;
  const connections = f._connections ? f._connections.map(c => `<span class="connection-tag">${c}</span>`).join('') : '';
  const genres = f._genres ? f._genres.map(g => `<span class="genre-tag">${g}</span>`).join('') : '';
  const overview = f.overview ? `<div class="overview">${f.overview}</div>` : '';
  const tmdbUrl = `https://www.themoviedb.org/movie/${f.id}`;
  const titleLink = `<a href="${tmdbUrl}" target="_blank" rel="noopener" title="View on TMDB">${f.title}</a>`;
  let buttons = '';
  if (mode === 'search') {
    buttons = `<button class="btn-sm btn-select" onclick="selectAsCurrentFilm(${f.id}, '${esc(f.title)}', '${esc(f.poster_path||'')}', '${year}')">Set as current film</button>
      ${isWatched ? '' : `<button class="btn-sm btn-watched" onclick="markWatched(${f.id}, '${esc(f.title)}', '${esc(f.poster_path||'')}', '${year}')">Mark as watched</button>`}`;
  } else if (mode === 'rec') {
    buttons = isWatched ? '<span style="font-size:12px;color:#888">Already watched</span>'
      : `<button class="btn-sm btn-watched" onclick="markWatched(${f.id}, '${esc(f.title)}', '${esc(f.poster_path||'')}', '${year}')">Mark as watched</button>`;
  }
  return `<div class="film-card" id="fc-${f.id}">
    ${poster}
    <div class="film-info">
      <div class="film-title">${titleLink}${watchedTag}</div>
      <div class="film-meta">${year}${rating ? ' &nbsp;' + rating : ''}</div>
      ${genres}
      ${overview}
      ${connections}
      <div class="btn-row">${buttons}</div>
    </div>
  </div>`;
}

async function selectAsCurrentFilm(id, title, poster, year) {
  saveCurrentFilm({ id, title, poster });
  const watched = getWatched();
  if (!watched[id]) {
    watched[id] = { id, title, poster, year, addedAt: Date.now() };
    saveWatched(watched);
  }
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('genre-filter').style.display = 'none';
  document.getElementById('mode-bar').style.display = 'flex';
  setMode('quick');
  renderCurrentBanner();
}

function renderCurrentBanner() {
  const f = getCurrentFilm();
  const banner = document.getElementById('current-banner');
  if (!f) { banner.style.display = 'none'; return; }
  banner.style.display = 'flex';
  banner.innerHTML = `<div><div style="font-size:12px;color:#888;margin-bottom:2px">Current film</div><div style="font-size:15px;font-weight:500">🎬 ${f.title}</div></div>
    <div style="margin-left:auto"><button class="btn-sm" onclick="clearCurrentFilm()">Change film</button></div>`;
}

function clearCurrentFilm() {
  localStorage.removeItem('fc_current');
  excludedPeople = [];
  document.getElementById('current-banner').style.display = 'none';
  document.getElementById('mode-bar').style.display = 'none';
  document.getElementById('genre-filter').style.display = 'none';
  document.getElementById('exclude-section').style.display = 'none';
  document.getElementById('recommendations').innerHTML = '';
  document.getElementById('search-input').value = '';
}

let currentMode = 'quick';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-quick').className = 'btn-mode' + (mode === 'quick' ? ' active' : '');
  document.getElementById('btn-advanced').className = 'btn-mode btn-mode-advanced' + (mode === 'advanced' ? ' active' : '');
  document.getElementById('genre-filter').style.display = 'none';
  document.getElementById('exclude-section').style.display = 'none';
  const cur = getCurrentFilm();
  if (!cur) return;
  if (mode === 'quick') {
    quickSearch(cur.id);
  } else {
    loadRecommendations(cur.id);
  }
}

async function quickSearch(movieId) {
  const el = document.getElementById('recommendations');
  el.innerHTML = '<p class="status-msg">Finding connections...</p>';
  try {
    const cr = await fetch(`${BASE}/movie/${movieId}/credits?api_key=${API_KEY}`);
    const credits = await cr.json();
    const cast = (credits.cast || []).slice(0,15).map(p => ({ id: p.id, name: p.name }));
    const crew = (credits.crew || []).filter(p => ['Director','Director of Photography','Cinematographer','Composer','Writer','Screenplay'].includes(p.job)).slice(0,5).map(p => ({ id: p.id, name: p.name }));
    const people = [...cast, ...crew].filter((p, i, arr) => arr.findIndex(x => x.id === p.id) === i);

    const watched = getWatched();
    const filmScores = {}, filmConnections = {}, filmData = {};

    await Promise.all(people.map(async person => {
      try {
        const pr = await fetch(`${BASE}/person/${person.id}/movie_credits?api_key=${API_KEY}`);
        const pd = await pr.json();
        [...(pd.cast||[]), ...(pd.crew||[])].forEach(m => {
          if (m.id === movieId) return;
          if (!m.vote_average || m.vote_average < 5.5) return;
          if (!m.vote_count || m.vote_count < 200) return;
          if (!filmScores[m.id]) { filmScores[m.id] = 0; filmConnections[m.id] = []; filmData[m.id] = m; }
          filmScores[m.id] += m.vote_average;
          filmConnections[m.id].push(person.name);
        });
      } catch(e) {}
    }));

    const sorted = Object.keys(filmScores)
      .map(id => ({ ...filmData[id], _score: filmScores[id], _connections: [...new Set(filmConnections[id])].slice(0,3) }))
      .filter(f => !watched[f.id])
      .sort((a,b) => b.vote_average - a.vote_average)
      .slice(0,20);

    if (!sorted.length) { el.innerHTML = '<p class="status-msg">No recommendations found. Try advanced search for more results.</p>'; return; }

    el.innerHTML = '<p class="status-msg">Loading overviews...</p>';
    await Promise.all(sorted.map(async film => {
      try {
        const dr = await fetch(`${BASE}/movie/${film.id}?api_key=${API_KEY}&language=en-US`);
        const dd = await dr.json();
        film.overview = dd.overview || '';
        film.poster_path = film.poster_path || dd.poster_path || '';
      } catch(e) {}
    }));

    el.innerHTML = `<p class="section-label">Quick search results <span class="results-mode-tag quick">Quick</span></p>` +
      sorted.map(f => filmCard(f, getWatched(), 'rec')).join('');
  } catch(e) {
    el.innerHTML = '<p class="status-msg">Could not load recommendations. Please try again.</p>';
  }
}

let excludedPeople = []; // { id, name }
let excludeSearchTimeout;

function renderExcludeSection() {
  const el = document.getElementById('exclude-section');
  el.style.display = '';
  const pills = excludedPeople.map(p =>
    `<span class="exclude-pill">${p.name} <button onclick="removeExclusion(${p.id})" title="Remove">✕</button></span>`
  ).join('');
  el.innerHTML = `
    ${pills ? `<div class="exclude-pills">${pills}</div>` : ''}
    <button class="exclude-toggle" onclick="toggleExcludeSearch()">+ Exclude a connection</button>
    <div id="exclude-search-box" style="display:none">
      <div class="exclude-search-row">
        <input type="text" id="exclude-input" placeholder="Search for a person..." oninput="onExcludeInput()" />
        <button onclick="closeExcludeSearch()">Cancel</button>
      </div>
      <div id="exclude-dropdown"></div>
    </div>`;
}

function toggleExcludeSearch() {
  const box = document.getElementById('exclude-search-box');
  if (!box) return;
  box.style.display = box.style.display === 'none' ? '' : 'none';
  if (box.style.display !== 'none') document.getElementById('exclude-input').focus();
}

function closeExcludeSearch() {
  const box = document.getElementById('exclude-search-box');
  if (box) box.style.display = 'none';
  const dd = document.getElementById('exclude-dropdown');
  if (dd) dd.innerHTML = '';
}

function onExcludeInput() {
  clearTimeout(excludeSearchTimeout);
  excludeSearchTimeout = setTimeout(searchPeople, 400);
}

async function searchPeople() {
  const q = document.getElementById('exclude-input').value.trim();
  const dd = document.getElementById('exclude-dropdown');
  if (!q) { dd.innerHTML = ''; return; }
  dd.innerHTML = '<p class="status-msg" style="font-size:12px;padding:6px 0">Searching...</p>';
  try {
    const r = await fetch(`${BASE}/search/person?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=en-US`);
    const d = await r.json();
    const results = (d.results || []).slice(0,5);
    if (!results.length) { dd.innerHTML = '<p class="status-msg" style="font-size:12px;padding:6px 0">No people found.</p>'; return; }
    dd.innerHTML = `<div class="exclude-dropdown">` + results.map(p => {
      const avatar = p.profile_path
        ? `<img class="exclude-avatar" src="https://image.tmdb.org/t/p/w45${p.profile_path}" alt="${p.name}">`
        : `<div class="exclude-avatar-placeholder">👤</div>`;
      const known = p.known_for_department || '';
      const knownFor = (p.known_for || []).slice(0,2).map(k => k.title || k.name).join(', ');
      return `<div class="exclude-person" onclick="addExclusion(${p.id}, '${esc(p.name)}')">
        ${avatar}
        <div>
          <div class="exclude-person-name">${p.name}</div>
          <div class="exclude-person-known">${known}${knownFor ? ' · ' + knownFor : ''}</div>
        </div>
      </div>`;
    }).join('') + `</div>`;
  } catch(e) {
    dd.innerHTML = '<p class="status-msg" style="font-size:12px;padding:6px 0">Search failed.</p>';
  }
}

function addExclusion(id, name) {
  if (excludedPeople.find(p => p.id === id)) return;
  excludedPeople.push({ id, name });
  closeExcludeSearch();
  document.getElementById('exclude-input').value = '';
  renderExcludeSection();
  const cur = getCurrentFilm();
  if (cur) loadRecommendations(cur.id);
}

function removeExclusion(id) {
  excludedPeople = excludedPeople.filter(p => p.id !== id);
  renderExcludeSection();
  const cur = getCurrentFilm();
  if (cur) loadRecommendations(cur.id);
}

async function loadRecommendations(movieId, preservedTicked = null) {
  const el = document.getElementById('recommendations');
  el.innerHTML = '<p class="status-msg">Finding connections — this may take a few seconds...</p>';
  try {
    const cr = await fetch(`${BASE}/movie/${movieId}/credits?api_key=${API_KEY}`);
    const credits = await cr.json();
    const cast = (credits.cast || []).map(p => ({ id: p.id, name: p.name }));
    const crew = (credits.crew || []).filter(p => ['Director','Director of Photography','Cinematographer','Composer','Writer','Screenplay'].includes(p.job)).map(p => ({ id: p.id, name: p.name }));
    const excludedIds = new Set(excludedPeople.map(p => p.id));
    const people = [...cast, ...crew]
      .filter((p, i, arr) => arr.findIndex(x => x.id === p.id) === i)
      .filter(p => !excludedIds.has(p.id));

    const watched = getWatched();
    const filmScores = {}, filmConnections = {}, filmData = {};

    const BATCH = 10;
    for (let i = 0; i < people.length; i += BATCH) {
      await Promise.all(people.slice(i, i + BATCH).map(async person => {
      try {
        const pr = await fetch(`${BASE}/person/${person.id}/movie_credits?api_key=${API_KEY}`);
        const pd = await pr.json();
        [...(pd.cast||[]), ...(pd.crew||[])].forEach(m => {
          if (m.id === movieId) return;
          if (!m.vote_average || m.vote_average < 5.5) return;
          if (!m.vote_count || m.vote_count < 200) return;
          if (!filmScores[m.id]) { filmScores[m.id] = 0; filmConnections[m.id] = []; filmData[m.id] = m; }
          filmScores[m.id] += m.vote_average;
          filmConnections[m.id].push(person.name);
        });
      } catch(e) {}
      }));
    }

    const sorted = Object.keys(filmScores)
      .map(id => ({ ...filmData[id], _score: filmScores[id], _connections: [...new Set(filmConnections[id])].slice(0,3) }))
      .filter(f => !watched[f.id])
      .sort((a,b) => b.vote_average - a.vote_average);

    if (!sorted.length) { el.innerHTML = '<p class="status-msg">No recommendations found. Try a different film.</p>'; return; }

    let detailsDone = 0;
    const DBATCH = 10;
    for (let i = 0; i < sorted.length; i += DBATCH) {
      await Promise.all(sorted.slice(i, i + DBATCH).map(async film => {
        try {
          const dr = await fetch(`${BASE}/movie/${film.id}?api_key=${API_KEY}&language=en-US`);
          const dd = await dr.json();
          film._genres = (dd.genres || []).slice(0,3).map(g => g.name);
          film.overview = dd.overview || '';
          film.poster_path = film.poster_path || dd.poster_path || '';
        } catch(e) {}
        detailsDone++;
        el.innerHTML = `<p class="status-msg">Loading film details… ${detailsDone} of ${sorted.length}</p>`;
      }));
    }

    allRecommendations = sorted;
    renderGenreFilter(sorted);
    renderExcludeSection();
    el.innerHTML = `<p class="section-label">Advanced search results <span class="results-mode-tag advanced">Advanced</span></p>` + sorted.map(f => filmCard(f, getWatched(), 'rec')).join('');
    if (preservedTicked) {
      document.querySelectorAll('#genre-filter input[type=checkbox]').forEach(cb => {
        cb.checked = preservedTicked.has(cb.value);
      });
      applyGenreFilter();
    }
  } catch(e) {
    el.innerHTML = '<p class="status-msg">Could not load recommendations. Please try again.</p>';
  }
}

let allRecommendations = [];

function renderGenreFilter(films) {
  const genreSet = new Set();
  films.forEach(f => (f._genres || []).forEach(g => genreSet.add(g)));
  const genres = [...genreSet].sort();
  const el = document.getElementById('genre-filter');
  if (!genres.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `<div class="filter-panel">
    <div class="filter-header">
      <span class="filter-title">Filter by genre</span>
      <div class="filter-actions">
        <button class="filter-link" onclick="setAllGenres(true)">Select all</button>
        <button class="filter-link" onclick="setAllGenres(false)">Clear all</button>
      </div>
    </div>
    <div class="filter-checkboxes">
      ${genres.map(g => `<label class="filter-checkbox-label" id="flabel-${CSS.escape(g)}">
        <input type="checkbox" checked value="${g}" onchange="applyGenreFilter()"> ${g}
      </label>`).join('')}
    </div>
  </div>`;
}

function applyGenreFilter() {
  const checked = new Set(
    [...document.querySelectorAll('#genre-filter input[type=checkbox]:checked')].map(cb => cb.value)
  );
  const unchecked = new Set(
    [...document.querySelectorAll('#genre-filter input[type=checkbox]:not(:checked)')].map(cb => cb.value)
  );
  unchecked.forEach(g => {
    const label = document.getElementById(`flabel-${CSS.escape(g)}`);
    if (label) label.classList.add('inactive');
  });
  checked.forEach(g => {
    const label = document.getElementById(`flabel-${CSS.escape(g)}`);
    if (label) label.classList.remove('inactive');
  });
  let visibleCount = 0;
  allRecommendations.forEach(f => {
    const card = document.getElementById(`fc-${f.id}`);
    if (!card) return;
    const filmGenres = f._genres || [];
    const show = filmGenres.length === 0 || filmGenres.some(g => checked.has(g));
    card.style.display = show ? '' : 'none';
    if (show) visibleCount++;
  });
  const noResults = document.getElementById('filter-no-results');
  const refreshBar = document.getElementById('filter-refresh-bar');
  if (visibleCount === 0) {
    if (!noResults) {
      const msg = document.createElement('p');
      msg.id = 'filter-no-results';
      msg.className = 'no-results-msg';
      msg.textContent = 'No films match the selected genres. Try ticking more genres above.';
      document.getElementById('recommendations').appendChild(msg);
    }
    if (refreshBar) refreshBar.remove();
  } else {
    if (noResults) noResults.remove();
    if (visibleCount < 10) {
      if (!refreshBar) {
        const bar = document.createElement('div');
        bar.id = 'filter-refresh-bar';
        bar.className = 'refresh-bar';
        bar.innerHTML = `<span>Only ${visibleCount} result${visibleCount !== 1 ? 's' : ''} match your genre filter.</span>
          <button onclick="refreshFromCurrentFilm()">Load a wider search</button>`;
        document.getElementById('recommendations').appendChild(bar);
      } else {
        refreshBar.querySelector('span').textContent = `Only ${visibleCount} result${visibleCount !== 1 ? 's' : ''} match your genre filter.`;
      }
    } else {
      if (refreshBar) refreshBar.remove();
    }
  }
}

function setAllGenres(checked) {
  document.querySelectorAll('#genre-filter input[type=checkbox]').forEach(cb => cb.checked = checked);
  applyGenreFilter();
}

function refreshFromCurrentFilm() {
  const cur = getCurrentFilm();
  if (!cur) return;
  const ticked = new Set(
    [...document.querySelectorAll('#genre-filter input[type=checkbox]:checked')].map(cb => cb.value)
  );
  loadRecommendations(cur.id, ticked);
}

function markWatched(id, title, poster, year) {
  const watched = getWatched();
  watched[id] = { id, title, poster, year, addedAt: Date.now() };
  saveWatched(watched);
  const card = document.getElementById(`fc-${id}`);
  if (card) card.remove();
  renderWatchedList();
}

function renderWatchedList() {
  const watched = getWatched();
  const el = document.getElementById('watched-list');
  const items = Object.values(watched).sort((a,b) => b.addedAt - a.addedAt);
  if (!items.length) { el.innerHTML = '<div class="empty-state"><div class="icon">🎬</div>No films marked as watched yet.</div>'; return; }
  el.innerHTML = `<p class="section-label">${items.length} film${items.length!==1?'s':''} watched</p>` +
    items.map(f => {
      const poster = f.poster ? `<img class="poster" src="${IMG}${f.poster}" alt="${f.title}" loading="lazy">` : `<div class="poster-placeholder">🎬</div>`;
      return `<div class="film-card" id="fc-${f.id}">${poster}
        <div class="film-info">
          <div class="film-title">${f.title} <span class="watched-pill">✓ watched</span></div>
          <div class="film-meta">${f.year || ''}</div>
          <div class="btn-row"><button class="btn-sm" onclick="removeWatched(${f.id})">Remove from watched</button></div>
        </div></div>`;
    }).join('');
}

function removeWatched(id) {
  const watched = getWatched();
  delete watched[id];
  saveWatched(watched);
  renderWatchedList();
}

function showTab(tab) {
  document.getElementById('view-search').style.display = tab === 'search' ? '' : 'none';
  document.getElementById('view-watched').style.display = tab === 'watched' ? '' : 'none';
  document.getElementById('tab-search').className = 'tab' + (tab === 'search' ? ' active' : '');
  document.getElementById('tab-watched').className = 'tab' + (tab === 'watched' ? ' active' : '');
  if (tab === 'watched') renderWatchedList();
}

renderCurrentBanner();
const cur = getCurrentFilm();
if (cur) {
  document.getElementById('mode-bar').style.display = 'flex';
  quickSearch(cur.id);
}
</script>
